<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Elves' workshop</title>
  <link rel="stylesheet" href="/css/site.css">
</head>
<body class="elves">
  <header class="top">
    <h1>Elves' workshop</h1>
    <nav><a href="/cards.html">QR cards &amp; LEGO plans</a></nav>
  </header>

  <section id="login" class="login" hidden>
    <h2>Grown-ups only</h2>
    <p class="muted">Enter the elves' PIN</p>
    <form id="loginForm">
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" aria-label="PIN">
      <button class="btn big" type="submit">Open the workshop</button>
      <p class="error" id="loginError" role="alert"></p>
    </form>
  </section>

  <main id="app" class="page" hidden>
    <div id="alerts"></div>

    <div class="grid">
      <section class="panel" id="trainPanel">
        <h2>Mail train</h2>
        <div id="trainStatus" class="muted">Checking…</div>
        <div class="actions">
          <button class="btn secondary" id="connect" data-cmd="Connect" disabled>Connect</button>
          <button class="btn secondary" id="disconnect" data-cmd="Disconnect" disabled>Disconnect</button>
        </div>
        <div class="actions">
          <button class="btn go" data-cmd="TestRun">Test run</button>
          <button class="btn" data-cmd="Stop">Stop run</button>
        </div>
        <section class="driver" aria-labelledby="driverTitle">
          <h3 id="driverTitle">Train driver</h3>
          <div class="actions">
            <button class="btn go" data-drive="reverse">&larr; Reverse</button>
            <button class="btn" data-cmd="Stop">Stop</button>
            <button class="btn go" data-drive="forward">Forward &rarr;</button>
          </div>
          <label class="speed" for="speed">
            <span>Speed <output id="speedOut" for="speed">30</output> of <span id="speedMax">70</span></span>
            <input type="range" id="speed" min="0" max="70" step="10" value="30">
          </label>
          <div class="actions">
            <button class="btn secondary" data-cmd="LightsOn">Lights on</button>
            <button class="btn secondary" data-cmd="LightsOff">Lights off</button>
          </div>
          <p class="muted" id="driverNote" role="status"></p>
        </section>
      </section>
      <section class="panel">
        <h2>Santa's speaker</h2>
        <div id="speakerStatus" class="muted">Checking…</div>
        <div class="actions">
          <button class="btn secondary" id="speakerConnect" disabled>Connect</button>
          <button class="btn secondary" id="speakerDisconnect" disabled>Disconnect</button>
        </div>
        <label class="speed" for="loudness">
          <span>Santa's loudness: the volume + <output id="loudnessOut" for="loudness">15</output></span>
          <input type="range" id="loudness" min="0" max="30" step="5" value="15" disabled>
        </label>
        <textarea class="voice-text" id="voiceText" rows="2" maxlength="300"
          placeholder="Ho ho ho! This is Santa, checking the speaker at the North Pole. Can you hear me?"
          aria-label="What Santa says in the test. Leave it empty for his usual line."></textarea>
        <div class="actions">
          <button class="btn secondary" id="voiceTest">Test Santa's voice</button>
        </div>
        <p class="muted" id="voiceNote" role="status"></p>
      </section>
      <section class="panel">
        <h2>This December</h2>
        <div class="stat" id="wishCount">0</div>
        <div class="muted">wishes sent · Claude spend <span id="spend">$0.00</span></div>
        <div class="actions" id="childActions"></div>
      </section>
      <section class="panel">
        <h2>Shopping list</h2>
        <div id="shopping" class="muted">Gift ideas will appear here.</div>
      </section>
    </div>

    <h2 style="margin:28px 0 0;font-size:18px">All letters</h2>
    <div id="wishes" class="wishes"></div>
  </main>

<script src="/js/train-panel.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const day = d => new Date(d + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });

  async function api(path, options) {
    const res = await fetch('/api/elves' + path, { headers: { 'Content-Type': 'application/json' }, ...options });
    if (res.status === 401) { showLogin(); throw new Error('login'); }
    return res;
  }

  function showLogin() { $('login').hidden = false; $('app').hidden = true; $('pin').focus(); }

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const pin = $('pin').value.trim();
    if (!pin) { $('loginError').textContent = 'Enter the PIN first'; return; }
    const res = await fetch('/api/elves/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin }) });
    if (res.ok) { $('login').hidden = true; $('pin').value = ''; $('loginError').textContent = ''; refresh(); }
    else $('loginError').textContent = res.status === 429 ? 'Too many tries. Wait 5 minutes.' : 'Wrong PIN';
  });
  $('pin').addEventListener('input', () => { $('loginError').textContent = ''; });

  async function refresh() {
    try {
      const [summary, wishes, train, speaker] = await Promise.all([
        api('/summary').then(r => r.json()),
        api('/wishes').then(r => r.json()),
        api('/train').then(r => r.json()),
        api('/speaker').then(r => r.json()),
      ]);
      $('app').hidden = false;
      renderSummary(summary);
      panel.render(train);
      renderSpeaker(speaker);
      renderAlerts(wishes);
      renderShopping(wishes);
      renderWishes(wishes);
    } catch (e) { if (e.message !== 'login') console.error(e); }
  }

  function renderSummary(s) {
    $('wishCount').textContent = s.wishes;
    $('spend').textContent = '$' + Number(s.claudeSpendUsd).toFixed(2);
    $('childActions').innerHTML = s.children.map(c =>
      `<button class="btn secondary" data-extra="${esc(c.id)}">Extra wish today for ${esc(c.name)}</button>`).join('');
  }

  // The mail train panel (shared with the train driver's page) and the speaker's connection timer.
  const panel = NorthPole.trainPanel({
    root: $('trainPanel'),
    api,
    onCommand: () => refreshLive(),
    onError: err => { if (err.message !== 'login') console.error(err); },
  });
  const speakerClock = NorthPole.clock();

  // Santa's speaker: a Chromecast one HQ keeps a link to, or the Pi's own output when none is named.
  // Santa plays this far above the speaker's volume, within its limits (as SantaLoudness.LevelFor on HQ).
  let speakerInfo = null;
  const santaLevel = (sp, above) => sp.state.volume >= sp.max ? sp.state.volume
    : Math.min(sp.max, Math.max(sp.min, sp.state.volume + above));
  const pct = v => Math.round(v * 100) + '%';
  // Says where Santa lands, and whether the ceiling holds him back, so a slider move that changes nothing makes sense.
  const santaLine = (sp, above) => {
    const level = santaLevel(sp, above), held = sp.state.volume < sp.max && sp.state.volume + above > sp.max;
    return `Santa plays at <b>${pct(level)}</b>: the volume + ${Math.round(above * 100)}` +
      (held ? `, held at the ${pct(sp.max)} ceiling.` : `, between ${pct(sp.min)} and ${pct(sp.max)}.`);
  };

  function renderSpeaker(sp) {
    const s = sp.state, now = Date.parse(sp.now);
    speakerInfo = sp;
    speakerClock.set(null);
    $('speakerConnect').disabled = !s.configured || s.connected;
    $('speakerDisconnect').disabled = !s.connected;
    const loud = $('loudness');
    loud.disabled = !s.configured;
    loud.max = Math.round(sp.mostAbove * 100);
    if (document.activeElement !== loud) loud.value = Math.round(sp.above * 100);
    $('loudnessOut').textContent = loud.value;
    if (!s.configured) {
      $('speakerStatus').innerHTML = '<span class="pill">The Pi\'s own output</span>' +
        '<div class="muted" style="margin-top:6px">No Chromecast speaker is named (Voice:CastTo), so Santa plays on the Pi.</div>';
      return;
    }
    const pills = [s.connected ? '<span class="pill ok">Connected <span id="spUptime"></span></span>'
      : s.wanted ? '<span class="pill">Looking for it</span>'
      : '<span class="pill bad">Disconnected</span>'];
    if (s.connected && s.volume != null) pills.push(`<span class="pill">Volume ${pct(s.volume)}</span>`);
    if (s.connected && s.muted) pills.push('<span class="pill bad">Muted</span>');
    if (s.connected && s.playing) pills.push(`<span class="pill">Playing ${esc(s.playing)}</span>`);
    const lines = [esc(s.name) + (s.address && s.address !== s.name ? ' · ' + esc(s.address) : '')];
    if (s.connected && sp.santaVolume != null)
      lines.push(`<span id="santaLine">${santaLine(sp, sp.above)}</span>`);
    if (!s.connected) lines.push(s.wanted
      ? 'HQ keeps looking. If it doesn\'t answer when Santa speaks, he plays on the Pi instead.'
      : 'Santa plays on the Pi\'s own output until Connect.');
    if (s.connected && s.at) lines.push('<span>updated <span id="spHeard"></span> ago</span>');
    $('speakerStatus').innerHTML = pills.join(' ') + lines.map(l => `<div class="muted" style="margin-top:6px">${l}</div>`).join('');
    if (s.connected) speakerClock.set({
      uptimeId: 'spUptime',
      heardId: 'spHeard',
      connected: s.connectedSince ? now - Date.parse(s.connectedSince) : null,
      heard: s.at ? now - Date.parse(s.at) : 0,
    });
  }

  // The loudness slider: shows Santa's level as it moves, and saves it on HQ when let go.
  $('loudness').addEventListener('input', e => {
    const above = +e.target.value;
    $('loudnessOut').textContent = above;
    if ($('santaLine') && speakerInfo?.state.volume != null) $('santaLine').innerHTML = santaLine(speakerInfo, above / 100);
  });
  $('loudness').addEventListener('change', async e => {
    try {
      await api('/speaker/loudness?above=' + (+e.target.value / 100), { method: 'POST' });
      $('voiceNote').textContent = "Saved. Press Test Santa's voice to hear it.";
      refreshLive();
    } catch (err) { if (err.message !== 'login') console.error(err); }
  });

  function renderAlerts(wishes) {
    const flagged = wishes.filter(w => w.reading?.parentHeadsUp);
    $('alerts').innerHTML = flagged.map(w =>
      `<div class="alert"><strong>${esc(w.childName)}, ${day(w.day)}</strong>${esc(w.reading.parentHeadsUp)}</div>`).join('');
  }

  function renderShopping(wishes) {
    const rows = [];
    for (const w of wishes) (w.reading?.giftIdeas || []).forEach((g, i) => rows.push({ w, g, i }));
    if (!rows.length) { $('shopping').textContent = 'Gift ideas will appear here.'; return; }
    $('shopping').innerHTML = '<ul class="gifts">' + rows.map(({ w, g, i }) =>
      `<li><label><input type="checkbox" data-wish="${w.id}" data-gift="${i}" ${w.bought[i] ? 'checked' : ''}>` +
      `<span>${esc(g.item)} · ${esc(w.childName)}${g.forSomeoneElse ? ' (for someone else)' : ''}</span></label></li>`).join('') + '</ul>';
  }

  function renderWishes(wishes) {
    $('wishes').innerHTML = wishes.map(w => `
      <article class="wish">
        <div>
          <div class="meta">${esc(w.childName)} · ${day(w.day)} · ${esc(w.status)}${w.byReindeer ? ' · delivered by Rudolph' : ''}
            ${w.reading ? `<span class="pill mood">${esc(w.reading.mood)}</span>` : ''}</div>
          <p class="text">“${esc(w.text)}”</p>
          ${w.reading ? `<p class="muted">${esc(w.reading.parentSummary)}</p>
            <p class="reply">${esc(w.reading.santaReply)}</p>
            ${w.reading.drawingDescription ? `<p class="muted">Drawing: ${esc(w.reading.drawingDescription)}</p>` : ''}` : ''}
          <div class="meta">${esc(w.brain || '')}${w.costUsd != null ? ' · $' + Number(w.costUsd).toFixed(4) : ''}</div>
          ${w.hasVoice ? `<div class="actions"><button class="btn secondary" data-replay="${w.id}">Play Santa on the station speaker</button></div>` : ''}
        </div>
        ${w.hasPhoto ? `<img src="/api/elves/wishes/${w.id}/photo" alt="Drawing from ${esc(w.childName)}" loading="lazy">` : '<span></span>'}
      </article>`).join('') || '<p class="muted">No letters yet. Print the QR cards and wait for the first wish!</p>';
  }

  document.addEventListener('click', async e => {
    const b = e.target.closest('button');
    if (!b) return;
    try {
      if (b.dataset.replay) await api(`/wishes/${b.dataset.replay}/replay`, { method: 'POST' });
      if (b.id === 'speakerConnect' || b.id === 'speakerDisconnect') {
        b.disabled = true;
        await api(b.id === 'speakerConnect' ? '/speaker/connect' : '/speaker/disconnect', { method: 'POST' });
        setTimeout(refreshLive, 1500);
      }
      if (b.id === 'voiceTest') {
        b.disabled = true;
        $('voiceNote').textContent = 'Santa is speaking…';
        try {
          const res = await api('/voice/test', { method: 'POST', body: JSON.stringify({ text: $('voiceText').value }) });
          $('voiceNote').textContent = res.ok
            ? `Santa spoke on ${(await res.json()).speaker}.`
            : 'Santa couldn\'t speak: is Piper running?';
        } finally { b.disabled = false; }
      }
      if (b.dataset.extra) { await api(`/children/${b.dataset.extra}/extra-wish`, { method: 'POST' }); b.textContent = 'Granted!'; }
    } catch (err) { if (err.message !== 'login') console.error(err); }
  });

  document.addEventListener('change', async e => {
    const box = e.target;
    if (!box.dataset.wish) return;
    await api(`/wishes/${box.dataset.wish}/gifts/${box.dataset.gift}`, { method: 'POST', body: JSON.stringify({ bought: box.checked }) });
  });

  // The train every 3 s, the letters every 15 s, and everything at once when the phone comes back to the page.
  async function refreshLive() {
    try {
      const [train, speaker] = await Promise.all([api('/train').then(r => r.json()), api('/speaker').then(r => r.json())]);
      panel.render(train);
      renderSpeaker(speaker);
    }
    catch (e) { if (e.message !== 'login') console.error(e); }
  }
  const showing = () => !$('app').hidden && !document.hidden;
  refresh();
  setInterval(() => { if (showing()) refreshLive(); }, 3000);
  setInterval(() => { if (showing()) refresh(); }, 15000);
  document.addEventListener('visibilitychange', () => { if (showing()) refresh(); });
})();
</script>
</body>
</html>
